name: Proposer une relecture multilingue
description: Découvrir l’outil local ou transmettre une relecture déjà préparée.
title: "[Relecture] "
labels: ["traduction", "à relire"]
body:
  - type: markdown
    attributes:
      value: |
        Vous n’avez pas encore préparé votre relecture ? Ouvrez l’application Windows ou macOS, sélectionnez le jeu, ouvrez **Options avancées**, puis cliquez sur **Réviser et corriger les traductions**. L’espace local compare les huit langues du jeu, retrouve les traductions manquantes et prépare les fichiers à transmettre.

        Consultez le [tutoriel complet](https://github.com/Le-Moulin/KuloNiku-FR/blob/main/docs/REVIEW_WORKSPACE.md), qui indique aussi la méthode manuelle en ligne de commande, puis exportez vos propositions et joignez-les ci-dessous.

        Ne joignez jamais l’espace HTML généré ni un fichier du jeu.
  - type: textarea
    id: summary
    attributes:
      label: Résumé de la relecture
      description: Collez ici le résumé copié par l’espace de relecture.
      placeholder: Passages sélectionnés, corrections proposées et vérifications restantes.
    validations:
      required: true
  - type: textarea
    id: files
    attributes:
      label: Fichiers exportés
      description: Glissez ici kuloniku-fr-propositions.csv et, si utile, kuloniku-fr-selection.json.
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Informations complémentaires
      description: Ajoutez seulement les captures ou précisions utiles.
  - type: checkboxes
    id: checks
    attributes:
      label: Vérification
      options:
        - label: Je n’ai joint ni fichier du jeu, ni extraction multilingue, ni espace HTML généré.
          required: true
