name: Paquets autonomes

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  package:
    strategy:
      matrix:
        include:
          - os: macos-latest
            platform: macOS
            package: macOS-Apple-Silicon
            architecture: arm64
            executable: KuloNiku-FR
            icon: KuloNikuFR.icns
          - os: macos-15-intel
            platform: macOS
            package: macOS-Intel
            architecture: x86_64
            executable: KuloNiku-FR
            icon: KuloNikuFR.icns
          - os: windows-latest
            platform: Windows
            package: Windows-x64
            architecture: x86_64
            executable: KuloNiku-FR.exe
            icon: KuloNikuFR.ico
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install uv
      - run: uv sync --locked --no-dev --group package
      - run: uv run --locked --no-dev --group package pyinstaller --clean --onefile --collect-all UnityPy --icon "packaging/icons/${{ matrix.icon }}" --name KuloNiku-FR packaging/entrypoint.py
      - if: matrix.platform == 'Windows'
        shell: pwsh
        run: uv run --locked --no-dev --group package pyinstaller --clean --onefile --windowed --icon "packaging/icons/KuloNikuFR.ico" --name "Installer KuloNiku FR" packaging/windows_entrypoint.py
      - shell: bash
        run: |
          mkdir -p package
          if [[ "${{ matrix.platform }}" == "Windows" ]]; then
            uv run --locked --no-dev --group package python packaging/create_update_manifest.py
            mkdir -p "package/resources/translations"
            cp "dist/${{ matrix.executable }}" package/resources/
            cp "dist/Installer KuloNiku FR.exe" package/
            cp "packaging/icons/KuloNikuFR.ico" package/resources/
            cp translations/fr.csv translations/source-hashes.csv translations/demo-overrides.csv translations/known-sources.json package/resources/translations/
            cp translations/review-overrides.csv translations/AGENT_BRIEF.md translations/NOTICE.md package/resources/translations/
            cp docs/TERMINOLOGY.md package/resources/translations/TERMINOLOGY.md
            cp README.md package/
            cp LICENSE SECURITY.md THIRD_PARTY_NOTICES.md package/resources/
            "package/Installer KuloNiku FR.exe" --self-test
            cd package
            7z a -tzip "KuloNiku-FR-${{ matrix.package }}.zip" \
              "Installer KuloNiku FR.exe" \
              README.md \
              resources
          else
            chmod +x "dist/${{ matrix.executable }}"
            lipo "dist/${{ matrix.executable }}" -verify_arch "${{ matrix.architecture }}"
          fi
      - if: matrix.platform == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: KuloNiku-FR-${{ matrix.package }}
          path: package/KuloNiku-FR-${{ matrix.package }}.*
      - if: matrix.platform == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: KuloNiku-FR-engine-${{ matrix.package }}
          path: dist/${{ matrix.executable }}
      - if: matrix.platform == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: KuloNiku-FR-release-data
          path: |
            package/translations.zip
            package/update-manifest.json

  package-macos-universal:
    needs: package
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: KuloNiku-FR-engine-macOS-Apple-Silicon
          path: build/engines/arm64
      - uses: actions/download-artifact@v4
        with:
          name: KuloNiku-FR-engine-macOS-Intel
          path: build/engines/x86_64
      - shell: bash
        run: |
          if ! arch -x86_64 /usr/bin/true 2>/dev/null; then
            sudo softwareupdate --install-rosetta --agree-to-license
          fi
          chmod +x build/engines/arm64/KuloNiku-FR build/engines/x86_64/KuloNiku-FR
          lipo build/engines/arm64/KuloNiku-FR -verify_arch arm64
          lipo build/engines/x86_64/KuloNiku-FR -verify_arch x86_64
          bash packaging/build_macos_universal_app.sh \
            build/engines/arm64/KuloNiku-FR \
            build/engines/x86_64/KuloNiku-FR \
            build/macos
          test -x "build/macos/KuloNiku FR.app/Contents/MacOS/KuloNiku FR"
          lipo "build/macos/KuloNiku FR.app/Contents/MacOS/KuloNiku FR" -verify_arch arm64 x86_64
          arch -arm64 "build/macos/KuloNiku FR.app/Contents/MacOS/KuloNiku FR" --self-test
          arch -x86_64 "build/macos/KuloNiku FR.app/Contents/MacOS/KuloNiku FR" --self-test
          codesign --verify --deep --strict "build/macos/KuloNiku FR.app"
          mkdir -p build/macos/dmg package
          ditto "build/macos/KuloNiku FR.app" "build/macos/dmg/KuloNiku FR.app"
          ln -s /Applications "build/macos/dmg/Applications"
          hdiutil create \
            -volname "KuloNiku FR" \
            -srcfolder build/macos/dmg \
            -ov \
            -format UDZO \
            package/KuloNiku-FR-macOS-Universal.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: KuloNiku-FR-macOS-Universal
          path: package/KuloNiku-FR-macOS-Universal.dmg

  package-steam-deck:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Dépendances de fabrication
        run: |
          sudo apt-get update
          sudo apt-get install --yes libfuse2 python3-tk xvfb
          python -m pip install uv
          uv sync --locked --no-dev --group package
      - name: Moteur et interface Linux
        run: |
          uv run python -c 'from kuloniku_fr import __version__; assert __version__ == "1.3.1"'
          uv run --locked --no-dev --group package pyinstaller \
            --clean --onefile --collect-all UnityPy \
            --name KuloNiku-FR packaging/entrypoint.py
          uv run --locked --no-dev --group package pyinstaller \
            --clean --onefile --windowed \
            --name KuloNiku-FR-GUI packaging/linux_entrypoint.py
          file dist/KuloNiku-FR dist/KuloNiku-FR-GUI | grep --quiet 'x86-64'
      - name: Outil AppImage vérifié
        env:
          APPIMAGETOOL_SHA256: b90f4a8b18967545fda78a445b27680a1642f1ef9488ced28b65398f2be7add2
        run: |
          curl --fail --location --retry 3 \
            --output build/appimagetool-x86_64.AppImage \
            https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          echo "$APPIMAGETOOL_SHA256  build/appimagetool-x86_64.AppImage" | sha256sum --check --strict
          chmod +x build/appimagetool-x86_64.AppImage packaging/build_steam_deck_appimage.sh
      - name: AppImage autonome
        run: |
          packaging/build_steam_deck_appimage.sh \
            dist/KuloNiku-FR \
            dist/KuloNiku-FR-GUI \
            build/appimagetool-x86_64.AppImage \
            package
      - name: Auto-test graphique sans écran
        run: |
          file package/KuloNiku-FR-Steam-Deck-x86_64.AppImage | grep --quiet 'x86-64'
          xvfb-run --auto-servernum \
            package/KuloNiku-FR-Steam-Deck-x86_64.AppImage \
            --appimage-extract-and-run --self-test
      - uses: actions/upload-artifact@v4
        with:
          name: KuloNiku-FR-Steam-Deck-x86_64
          path: |
            package/KuloNiku-FR-Steam-Deck-x86_64.AppImage
            package/KuloNiku-FR-Steam-Deck-x86_64.AppImage.sha256

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [package, package-macos-universal, package-steam-deck]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - shell: bash
        run: |
          mkdir release-files
          find artifacts -type f \( -name '*.dmg' -o -name '*.zip' -o -name '*.AppImage' -o -name 'update-manifest.json' \) -exec cp {} release-files/ \;
          cd release-files
          sha256sum *.dmg *.zip *.AppImage > SHA256SUMS.txt
          cat > release-notes.md <<'EOF'
          KuloNiku FR permet de jouer en français à la démo et au jeu complet.

          ## Installer

          - **Windows** : téléchargez `KuloNiku-FR-Windows-x64.zip`, décompressez-le, puis ouvrez **Installer KuloNiku FR.exe**.
          - **macOS** : téléchargez `KuloNiku-FR-macOS-Universal.dmg`, ouvrez-le, puis glissez **KuloNiku FR** dans **Applications**. Si macOS bloque la première ouverture, utilisez **Réglages Système > Confidentialité et sécurité > Ouvrir quand même**.
          - **Steam Deck** : téléchargez `KuloNiku-FR-Steam-Deck-x86_64.AppImage`, autorisez son exécution dans ses propriétés, puis ouvrez-le en mode Bureau.

          ## Cette mise à jour

          - Corrections de traduction validées en jeu : températures, historique des dialogues, recettes et formulations de personnages.

          Projet communautaire non officiel. Aucun fichier complet du jeu n’est distribué.
          EOF
          release_flags=(--title "KuloNiku FR ${GITHUB_REF_NAME#v}" --notes-file release-notes.md --verify-tag)
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            release_flags+=(--prerelease)
          fi
          gh release create "${GITHUB_REF_NAME}" "${release_flags[@]}" \
            ./*.dmg ./*.zip ./*.AppImage \
            ./SHA256SUMS.txt ./update-manifest.json
        env:
          GH_TOKEN: ${{ github.token }}

  virustotal:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    permissions:
      contents: write
    uses: ./.github/workflows/virustotal-release.yml
    with:
      tag: ${{ github.ref_name }}
    secrets: inherit
